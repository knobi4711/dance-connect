name: iOS validation

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build-simulator:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync Capacitor
        run: npm run cap:sync

      - name: Build iOS simulator target
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO
          build
